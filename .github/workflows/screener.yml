name: Screener

on:
  schedule:
    - cron: "17 22 * * 1-5"   # Mo–Fr 22:17 UTC (nach US-Börsenschluss)
  workflow_dispatch:
    inputs:
      limit:
        description: "Nur die ersten N Aktien (Test, leer = alle)"
        required: false
        default: ""
      digest:
        description: "Wochen-Digest jetzt verschicken (true/false)"
        required: false
        default: "false"
  push:
    branches: [main]
    paths: ["screener/web/**"]   # nur Oberfläche neu ausliefern, ohne Datenlauf

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Letzten Datenstand laden (Branch screener-data)
        run: |
          git clone --depth 1 --branch screener-data \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state \
            || mkdir -p state
          rm -rf state/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - name: Abhängigkeiten
        run: pip install -r screener/requirements.txt

      - name: Tests
        run: python -m unittest discover -s screener/tests -t .

      - name: Datenlauf
        if: github.event_name != 'push'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AlexInvest-Screener github.com/alexanderlackendorf-sketch/AlexInvest' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="--limit ${{ github.event.inputs.limit }} --sec-max 10"; fi
          python -m screener.pipeline.run --state state $ARGS

      - name: Wochen-Digest (freitags oder manuell) als Issue-Kommentar -> GitHub verschickt die E-Mail
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" != "5" ] && [ "${{ github.event.inputs.digest }}" != "true" ]; then
            echo "Kein Digest-Tag"; exit 0
          fi
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          SITE="https://${OWNER,,}.github.io/${REPO}/"
          python -m screener.pipeline.digest --state state --out digest.md --site "$SITE" --mention "$OWNER"
          gh label create screener-digest --color 1f6feb --description "Wochen-Digest des Screeners" --force
          NUM=$(gh issue list --label screener-digest --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "📬 Screener-Digest" --label screener-digest \
              --body "Hier erscheint jeden Freitag der Wochen-Digest des Screeners. Jeder neue Kommentar löst eine E-Mail-Benachrichtigung aus.")
            NUM="${URL##*/}"
          fi
          gh issue comment "$NUM" --body-file digest.md

      - name: Datenstand sichern (ein Commit, ohne Historie -> Repo bleibt klein)
        if: github.event_name != 'push'
        run: |
          cd state
          git init -q -b screener-data
          git add -A
          git -c user.name="screener-bot" -c user.email="actions@users.noreply.github.com" \
            commit -qm "Datenstand $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screener-data
          rm -rf .git

      - name: Website zusammenbauen
        run: |
          mkdir -p site
          cp -r screener/web/. site/
          if [ -d state/public ]; then cp -r state/public site/data; fi
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
