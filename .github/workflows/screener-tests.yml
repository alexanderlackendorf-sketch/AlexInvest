name: Screener-Tests

# Tests bei jeder Änderung am Screener, bevor sie in main landet
on:
  pull_request:
    paths: ["screener/**", ".github/workflows/screener*.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt
      - run: pip install -r screener/requirements.txt
      - run: python -m unittest discover -s screener/tests -t .
      - name: JavaScript-Syntax der Oberfläche
        run: node -e "new Function(require('fs').readFileSync('screener/web/app.js','utf8'))"
